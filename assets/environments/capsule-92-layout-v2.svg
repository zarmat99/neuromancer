<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg{fill:#11171a}.panel{fill:#e7e2d4;stroke:#152126;stroke-width:8}
      .shell{fill:#f4f0e4;stroke:#26363c;stroke-width:10}.foam{fill:#85664f;stroke:#3e3027;stroke-width:6}
      .fixture{fill:#cdd5d2;stroke:#33464c;stroke-width:6}.molly{fill:#181c20;stroke:#b52150;stroke-width:7}
      .case{fill:#8b805d;stroke:#1a6d74;stroke-width:7}.axis{stroke:#19aeb6;stroke-width:4;stroke-dasharray:18 14}
      .dim{stroke:#eef1e6;stroke-width:3;marker-start:url(#arr);marker-end:url(#arr)}
      .txt{font-family:DejaVu Sans,sans-serif;fill:#10181b;font-size:28px}.head{font-family:DejaVu Sans,sans-serif;fill:#eef1e6;font-size:36px;font-weight:bold}
      .label{font-family:DejaVu Sans,sans-serif;fill:#eef1e6;font-size:25px}.small{font-family:DejaVu Sans,sans-serif;fill:#10181b;font-size:22px}
      .safe{fill:#31bfc0;fill-opacity:.16;stroke:#138b91;stroke-width:4;stroke-dasharray:12 9}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eef1e6"/>
    </marker>
  </defs>
